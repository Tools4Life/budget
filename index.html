<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Budget Tracker</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-v3-180.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon-v3-512.png">
<link rel="icon" type="image/png" href="icon-v3-192.png">
<script>window.FB={email:null,signOut:function(){}};window.FB.ready=new Promise(function(r){window.FB._r=r});</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF;--surface:#F4F6FA;--surface2:#EBEFF6;--ink:#101828;--muted:#667085;--line:#E4E7EC;
  --accent:#1F5BFF;--accent-soft:#E8EEFF;--accent-ink:#FFFFFF;--good:#12805C;--warn:#D92D20;--amber:#B54708;--amber-soft:#FFF4E5;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --bg:#0E131C;--surface:#182030;--surface2:#212B3D;--ink:#EEF2F8;--muted:#9AA4B5;--line:#273246;
  --accent:#5B8CFF;--accent-soft:#1B2A4F;--accent-ink:#FFFFFF;--good:#4CC79A;--warn:#FF7A6E;--amber:#F5A54A;--amber-soft:#3A2A14;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
  -webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
.emoji{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1}

/* shell */
.app{display:flex;min-height:100%}
.nav{width:264px;flex:none;background:var(--bg);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.25rem;padding:6px 10px 18px;letter-spacing:-.02em}
.brand .emoji{font-size:1.6rem}
.navbtn{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;padding:12px;border-radius:14px;font-weight:600;text-align:left;font-size:1rem}
.navbtn .nicon{width:22px;height:22px;flex:none;color:var(--muted)}
.navbtn[aria-current="page"] .nicon{color:var(--accent)}
.navbtn:hover{background:var(--surface)}
.navbtn[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.navfoot{margin-top:auto;color:var(--muted);font-size:.82rem;padding:10px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.menubtn{display:none;border:0;background:none;width:42px;height:42px;border-radius:12px;place-items:center}
.menubtn svg{width:24px;height:24px}
.appbar h1{font-size:1.15rem;margin:0;font-weight:700;flex:1;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.leftpill{border:0;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:7px 14px;text-align:right;line-height:1.1}
.leftpill small{display:block;font-size:.72rem;font-weight:600;opacity:.85}
.leftpill b{font-size:1.05rem;font-weight:800}
.leftpill.neg{background:#FDECEA;color:var(--warn)}
.scrim{display:none}
@media (max-width:819px){
  .nav{position:fixed;left:0;top:0;bottom:0;z-index:20;transform:translateX(-102%);transition:transform .25s ease;
    padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 0 0 1px var(--line)}
  .app.open .nav{transform:none}
  .app.open .scrim{display:block;position:fixed;inset:0;background:rgba(16,24,40,.35);z-index:15}
  .menubtn{display:grid}
}
@media (prefers-reduced-motion: reduce){.nav{transition:none}}
.view{display:none;flex:1}
.view.on{display:block}
.pagepad{max-width:640px;margin:0 auto;padding:18px 18px 40px}

/* home */
.hero{background:var(--accent);color:#fff;border-radius:24px;padding:20px 20px 18px;position:relative;overflow:hidden;
  background-image:linear-gradient(140deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,.06) 45%,rgba(0,0,0,.10) 100%);
  box-shadow:0 14px 30px -14px rgba(16,24,40,.55),0 2px 6px -2px rgba(16,24,40,.18),inset 0 1px 0 rgba(255,255,255,.28)}
.hero::after{content:"";position:absolute;left:calc(var(--gx,88%) - 110px);top:calc(var(--gy,0%) - 110px);width:220px;height:220px;border-radius:50%;background:radial-gradient(closest-side,rgba(255,255,255,var(--ga,.18)),rgba(255,255,255,0));pointer-events:none;transition:left .4s ease,top .4s ease}
.hero{transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(var(--sc,1));transition:transform .45s cubic-bezier(.2,.9,.25,1.25),box-shadow .45s ease;will-change:transform;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.hero.tilt{transition:transform .12s ease-out,box-shadow .2s ease;box-shadow:0 22px 40px -16px rgba(16,24,40,.6),0 4px 10px -4px rgba(16,24,40,.2),inset 0 1px 0 rgba(255,255,255,.3)}
.hero.tilt::after{transition:none;--ga:.32}
@media (prefers-reduced-motion: reduce){.hero{transform:none !important}}
.hero > *{position:relative;z-index:1}
.hbills{background-color:#7A5AF8}
.hplan{background-color:#0E9384}
.hhist{background-color:#3E4FD8}
.hbills .big,.hplan .big,.hhist .big{font-size:clamp(2.4rem,11vw,3rem);margin:4px 0 6px}
.hero .lbl{font-weight:600;opacity:.9}
.hero .big{color:#fff;font-size:clamp(2.8rem,13vw,3.6rem);margin:6px 0 10px}
.hero.neg{background-color:var(--warn)}
.hero .meter{height:8px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden}
.hero .meter i{display:block;height:100%;background:#fff;border-radius:99px}
.hero .fine{font-size:.86rem;opacity:.92;margin-top:10px;line-height:1.35}
.topadd{border:0;background:var(--accent);color:#fff;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.topadd[hidden]{display:none}
.topadd svg{width:20px;height:20px}
.hero .addtx{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border:0;border-radius:14px;background:#fff;color:var(--accent);font-weight:700;font-size:1.02rem;margin-top:14px}
.hero.neg .addtx{color:var(--warn)}
.hero .addtx svg{width:20px;height:20px}
.hero .herobtns{display:flex;gap:10px;margin-top:14px}
.hero .herobtns .addtx{margin-top:0;flex:1;white-space:nowrap;padding:0 8px}
.hero .herobtns .moneyin{flex:1;background:rgba(255,255,255,.18);color:#fff;font-size:.95rem}
.hero.neg .herobtns .moneyin{color:#fff}
.hero .setinc{border:0;background:#fff;color:var(--accent);border-radius:12px;padding:9px 14px;font-weight:700;margin-top:12px}
.rings{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ringcard{border:1.5px solid var(--line);background:var(--bg);border-radius:20px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.ringcard.over{border-color:#FDA29B;background:#FFF6F5}
.ring{position:relative;width:96px;height:96px}
.ring svg{width:96px;height:96px;transform:rotate(-90deg)}
.ring .trk{stroke:var(--surface2)}
.ring .val{stroke:var(--accent);transition:stroke-dashoffset .5s cubic-bezier(.2,.8,.2,1)}
.ringcard.over .val{stroke:#F04438}
.ringcard.fast{border-color:var(--line);background:var(--bg)}
.ringcard.fast .val{stroke:#F79009}
.ringcard .pace{color:var(--amber);font-size:.78rem;font-weight:700;margin-top:-4px}
.ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.ring .ctr b{font-size:1.15rem;font-weight:800;letter-spacing:-.02em}
.ring .ctr small{font-size:.72rem;color:var(--muted);font-weight:600}
.ringcard.over .ctr b,.ringcard.over .ctr small{color:var(--warn)}
.ringcard .nm{font-weight:700;font-size:.95rem;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ringcard .of{color:var(--muted);font-size:.8rem;margin-top:-4px}
@media (prefers-reduced-motion: reduce){.ring .val{transition:none}}
.fab{position:fixed;right:20px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:64px;height:64px;border-radius:50%;border:0;background:var(--accent);color:#fff;
  box-shadow:0 8px 22px rgba(31,91,255,.38);display:grid;place-items:center;z-index:8}
.fab svg{width:30px;height:30px}
@media (min-width:820px){.fab{right:calc(50% - 320px + 132px - 32px)}}

/* add sheet */
.addhead{display:flex;justify-content:space-between;align-items:center}
.display{text-align:center;margin:4px 0 0}
.display .num{font-size:clamp(2.8rem,14vw,3.8rem);font-weight:800;letter-spacing:-.04em;line-height:1.05}
.display .num.zero{color:#B8C0CC}
.selcat{text-align:center;color:var(--muted);font-weight:600;font-size:.92rem;min-height:1.4em}
.selcat b{color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x proximity;padding:10px 20px 8px;margin:0 -20px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;scroll-snap-align:start;border:0;background:none;width:70px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:0}
.chip .bub{width:54px;height:54px;border-radius:18px;background:var(--surface);display:grid;place-items:center;font-size:1.65rem}
.chip .nm{font-size:.74rem;font-weight:600;max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .rm{font-size:.68rem;color:var(--muted)}
.chip .rm.over{color:var(--warn)}
.chip[aria-checked="true"] .bub{background:var(--accent-soft);box-shadow:inset 0 0 0 2.5px var(--accent)}
.chip[aria-checked="true"] .nm{color:var(--accent)}
.padrow{display:flex;gap:8px;margin-bottom:8px}
.padrow input,.padrow select{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:.95rem}
.padrow input:focus,.padrow select:focus{border-color:var(--accent);outline:none}
.padrow input[type=date]{flex:0 0 auto;width:auto}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:4px}
.key{height:54px;border:0;border-radius:15px;background:var(--surface);font-size:1.5rem;font-weight:600}
.key:active{background:var(--surface2)}
.key.fn{font-size:1.15rem;color:var(--muted)}
.primary{width:100%;height:56px;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1.08rem;margin-top:10px}
.primary:disabled{opacity:.35}

/* shared lists/cards */
.card{background:var(--surface);border-radius:20px;padding:16px}
.sum{display:flex;justify-content:space-between;align-items:center;padding:7px 0;gap:12px}
.sum span{color:var(--muted)}
.sum b{font-weight:700}
.sum.total{border-top:1.5px solid var(--line);margin-top:6px;padding-top:12px}
.sum.total span{color:var(--ink);font-weight:700}
.big{font-size:2.6rem;font-weight:800;letter-spacing:-.035em;line-height:1}
.big.neg{color:var(--warn)}
h2{font-size:1.1rem;margin:28px 2px 10px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
h2 small{font-weight:500;color:var(--muted);font-size:.88rem}
.list{background:var(--bg);border:1.5px solid var(--line);border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);min-height:64px;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.row:first-child{border-top:0}
.grow{flex:1;min-width:0}
.t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m{color:var(--muted);font-size:.84rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v{font-weight:700;white-space:nowrap}
.ebub{width:42px;height:42px;border-radius:14px;background:var(--surface);display:grid;place-items:center;font-size:1.35rem;flex:none}
.empty{padding:20px 16px;color:var(--muted)}
.ghost{width:100%;border:1.5px dashed var(--line);background:none;border-radius:16px;padding:13px;font-weight:600;color:var(--accent);margin-top:10px}
.day{color:var(--muted);font-size:.82rem;font-weight:700;margin:18px 4px 6px}
.amtbtn{border:0;background:none;font-weight:700;padding:8px 4px;border-radius:10px}
.del{border:0;background:var(--warn);color:#fff;border-radius:10px;padding:8px 12px;font-weight:700}
.monthnav{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:6px}
.monthnav button{border:0;background:var(--surface);width:38px;height:38px;border-radius:12px;font-size:1.1rem}
.monthnav button:disabled{opacity:.3}
.monthnav div{min-width:10em;text-align:center;font-weight:700}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over i{background:var(--warn)}
.filters{display:flex;gap:8px;margin:4px 0 12px}
.fchip{border:1.5px solid var(--line);background:none;border-radius:999px;padding:7px 14px;font-weight:600;font-size:.9rem}
.fchip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

/* bills calendar tile */
.cal{position:relative;width:48px;margin:0 14px 0 0;flex:none;border-radius:12px;overflow:visible;text-align:center;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--line)}
.cal .mo{display:block;background:var(--accent);color:#fff;font-size:.68rem;font-weight:700;padding:2px 0;border-radius:12px 12px 0 0}
.cal .dd{display:block;font-size:1.3rem;font-weight:800;padding:2px 0 4px;line-height:1.15}
.cal .badge{position:absolute;right:-17px;bottom:-6px;width:26px;height:26px;border-radius:50%;background:var(--bg);box-shadow:0 0 0 1.5px var(--line);display:grid;place-items:center;font-size:.95rem}
.paid .cal .mo{background:var(--muted)}
.paid .t,.paid .v{color:var(--muted)}
.paid .v{text-decoration:line-through}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center;padding:0;flex:none}
.check.on{background:var(--good);border-color:var(--good);color:#fff}
.check svg{width:15px;height:15px}
.due-soon{color:var(--accent);font-weight:600}
.needamt{color:var(--amber);font-weight:700}
.est{color:var(--muted);font-weight:500;font-size:.78rem;margin-right:2px}
.upnext .row{min-height:58px}
#homeBody{padding-bottom:12px}
#homeBody h2{margin:18px 2px 8px}
#homeBody .hero{padding:16px 18px 16px}
#homeBody .hero .big{font-size:clamp(2.4rem,11vw,3rem);margin:2px 0 8px}
#homeBody .hero .fine{margin-top:8px}
#homeBody .hero .addtx{height:46px}
#homeBody .rings.strip{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-left:18px;-webkit-overflow-scrolling:touch;margin:0 -18px;padding:6px 18px 4px;scrollbar-width:none}
#homeBody .rings.strip::-webkit-scrollbar{display:none}
#homeBody .rings.strip .ringcard{flex:0 0 calc((100% - 24px) / 4.3);scroll-snap-align:start}
#homeBody .ringcard{padding:10px 4px 9px;gap:4px;border-radius:16px;min-width:0}
#homeBody .ring,#homeBody .ring svg{width:64px;height:64px}
#homeBody .ring .ctr b{font-size:.9rem}
#homeBody .ring .ctr small{font-size:.62rem}
#homeBody .ringcard .nm{font-size:.74rem;letter-spacing:-.01em}
#homeBody .ringcard .of{font-size:.7rem;margin-top:-2px}
#homeBody .ringcard .pace{font-size:.66rem;margin-top:-2px}
#homeBody .upnext .row{min-height:50px;padding:7px 12px}
#homeBody .upnext .ebub{width:34px;height:34px;font-size:1.15rem;border-radius:11px}
#homeBody .row[hidden]{display:none}
.btnrow[hidden]{display:none}
.sharebtn{border:0;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:.82rem;border-radius:999px;padding:5px 12px;cursor:pointer}
.pgled{padding:6px 14px;margin-top:12px}
.pglr{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:40px;font-size:.92rem;border-bottom:1px solid var(--line)}
.pglr:last-child{border-bottom:0}
.pglr[hidden]{display:none}
.pglr span{color:var(--muted)}
.pglr b{font-variant-numeric:tabular-nums}
.pglr .minput{width:110px;height:34px}
.row.billrow{background:var(--surface)}
.row.billrow .ebub{background:var(--bg);opacity:.75}
.row.billrow .t,.row.billrow .v{color:var(--muted);font-weight:600}
.tag.btag{color:var(--muted);background:var(--surface2)}
.pgacc{background:var(--surface);border-radius:16px;padding:8px 14px 10px;font-size:.84rem}
.pgah,.pgar{display:grid;grid-template-columns:1fr 72px 72px;gap:6px;align-items:center;padding:3px 0}
.pgah{color:var(--muted);font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--line);padding-bottom:5px;margin-bottom:2px}
.pgah span:not(:first-child),.pgar span:not(.nm),.pgar b{text-align:right;font-variant-numeric:tabular-nums}
.pgar .nm{display:flex;align-items:center;gap:7px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.pgar .nm i{width:8px;height:8px;border-radius:50%;flex:none}
.pgar span:not(.nm){color:var(--muted)}
.pgar b{font-weight:700;color:var(--muted)}
.pgar b.chg{color:var(--ink)}
.ring .rbadge{position:absolute;right:-8px;top:-6px;width:24px;height:24px;border-radius:50%;background:var(--bg);box-shadow:0 0 0 1.5px var(--line);display:grid;place-items:center;font-size:.8rem}
#homeBody.tight .ring,#homeBody.tight .ring svg{width:50px;height:50px}
#homeBody.tight .ring .ctr b{font-size:.78rem}
#homeBody.tight .ring .ctr small,#homeBody.tight .ringcard .of{display:none}
#homeBody.tight .ringcard{padding:8px 4px 7px}
#homeBody.tight h2{margin:12px 2px 6px}
#homeBody .row.more{justify-content:center;color:var(--accent);font-weight:700;min-height:44px;cursor:pointer}
.upnext .ebub{width:38px;height:38px}
.nudge{display:flex;align-items:center;gap:10px;width:100%;border:1.5px solid var(--amber);background:var(--amber-soft);color:var(--ink);border-radius:16px;padding:12px 14px;margin-top:14px;text-align:left;font-weight:600}
.nudge span{flex:1}.nudge b{color:var(--amber)}
.rowbtn{cursor:pointer}
.due-late{color:var(--warn);font-weight:600}
.tag{display:inline-block;font-size:.72rem;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:1px}

/* inline money inputs (planner) */
.minput{width:120px;text-align:right;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:7px 10px;font-weight:700}
.minput:focus{border-color:var(--accent);outline:none}

/* sheets */
dialog{border:0;padding:0;margin:auto auto 0;width:100%;max-width:520px;max-height:92%;background:var(--bg);color:var(--ink);border-radius:26px 26px 0 0}
@media (max-width:639px){dialog>.sheet::before,dialog>form.sheet::before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:var(--line);margin:-8px auto 12px}}
dialog::backdrop{background:rgba(16,24,40,.4)}
@media (min-width:640px){dialog{margin:auto;border-radius:26px}}
.sheet{padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.sheethead h3{margin:0;font-size:1.2rem}
.x{border:0;background:var(--surface);width:38px;height:38px;border-radius:12px;font-size:1.1rem}
.flabel{display:block;font-weight:600;font-size:.9rem;margin:14px 2px 6px}
.finput{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px}
.finput:focus{border-color:var(--accent);outline:none}
.epick{display:flex;flex-wrap:wrap;gap:6px}
.epick button{width:44px;height:44px;border-radius:12px;border:0;background:var(--surface);font-size:1.35rem}
.epick button[aria-checked="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent)}
.catpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.catpick button{border:0;background:var(--surface);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:600;font-size:.8rem;min-width:0}
.catpick button span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.catpick .emoji{font-size:1.4rem}
.catpick button[aria-checked="true"]{background:var(--accent-soft);box-shadow:inset 0 0 0 2px var(--accent);color:var(--accent)}
.cpick button{border-radius:50%;width:36px;height:36px}
.cpick button[aria-checked="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.abar{width:6px;align-self:stretch;border-radius:4px;flex:none;margin:2px 0}
.adot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:0}
#acctSel{border-left-width:6px !important}
.seg{display:flex;background:var(--surface);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:9px;font-weight:600}
.seg button[aria-checked="true"]{background:var(--bg);color:var(--accent);box-shadow:0 1px 2px rgba(16,24,40,.12)}
.danger{width:100%;border:0;background:none;color:var(--warn);font-weight:700;padding:14px;margin-top:4px}
.toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translate(-50%,-8px);background:var(--ink);color:var(--bg);
  padding:11px 16px;border-radius:14px;font-weight:600;font-size:.93rem;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:92%;text-align:center;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
.hint{color:var(--muted);font-size:.86rem;margin:10px 2px 0}
.fhelp{color:var(--muted);font-size:.8rem;margin:5px 2px 0}
.bmark{width:34px;height:34px;border-radius:8px;display:block;flex:none}
.bmark svg{width:20px;height:20px}
.pgbar{position:sticky;top:calc(57px + env(safe-area-inset-top,0px));z-index:4;margin:-4px -2px 12px;padding:10px 14px;border-radius:16px;background:var(--good);color:#fff;display:flex;justify-content:space-between;align-items:center;font-weight:700;box-shadow:0 6px 16px rgba(16,24,40,.12)}
.pgbar.neg{background:var(--warn)}
.pgbar b{font-size:1.25rem}
.pgrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.pgrow:first-child{border-top:0}
.pgrow .grow{min-width:0}
.pgrow .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pgrow .m{color:var(--muted);font-size:.8rem}
.stepper{display:flex;align-items:center;gap:4px;flex:none}
.stepper button{width:34px;height:34px;border-radius:10px;border:0;background:var(--surface);font-weight:800;font-size:1.1rem;color:var(--accent)}
.stepper .minput{width:76px;padding:7px 8px}
.tcard .sum{flex-wrap:wrap}
.tcard .stepper{margin-left:auto}
.tcard .stepper button{background:var(--bg)}
.tcard .sum span b{color:var(--ink)}
.ccard{padding:12px 14px;border-top:1px solid var(--line)}
.ccard:first-child{border-top:0}
.ccard .top{display:flex;align-items:center;gap:10px}
.ccard .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.ccard .grid.three{grid-template-columns:1fr 1fr 1fr}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:600;font-size:.82rem;padding:6px 0 0}
.ccard .grid label{font-size:.74rem;color:var(--muted);font-weight:600;display:flex;flex-direction:column;gap:3px}
.ccard .grid .minput{width:100%;text-align:left;font-weight:600}
.ccard .res{margin-top:8px;font-size:.84rem;color:var(--muted)}
.ccard .res b{color:var(--ink)}
.ccard .res .bad{color:var(--warn);font-weight:700}
.result{background:var(--accent);color:#fff;border-radius:20px;padding:16px;margin-top:14px}
.result .lbl{font-weight:600;opacity:.9;font-size:.9rem}
.result .when{font-size:1.9rem;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.result .fine{opacity:.92;font-size:.88rem}
.result.bad{background:var(--warn)}
.result svg{width:100%;height:110px;display:block;margin-top:12px}
.paynow .row{min-height:52px}
.warnbox{border:1.5px solid var(--amber);background:var(--amber-soft);border-radius:14px;padding:10px 12px;margin-top:10px;font-size:.9rem;font-weight:600}
.btnrow{display:flex;gap:8px;margin-top:10px}
.btnrow button{flex:1;margin-top:0}
.hbars{display:flex;align-items:flex-end;gap:6px;height:140px;padding:8px 2px 0}
.hbar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;border:0;background:none;padding:0;gap:4px;min-width:0}
.hbar i{display:block;width:100%;max-width:38px;border-radius:8px 8px 3px 3px;background:var(--surface2);min-height:3px}
.hbar[aria-pressed="true"] i{background:var(--accent)}
.hbar small{font-size:.72rem;color:var(--muted);font-weight:600}
.hbar[aria-pressed="true"] small{color:var(--accent)}
.hbar em{font-style:normal;font-size:.68rem;color:var(--muted);white-space:nowrap}
.hrow{display:block;width:100%;border:0;border-top:1px solid var(--line);background:none;text-align:left;padding:12px 14px}
.hrow:first-child{border-top:0}
.hrow .m{white-space:normal !important;overflow:visible !important}
.hrow .top{display:flex;align-items:center;gap:12px}
.hrow .mini{height:6px;border-radius:4px;background:var(--surface2);margin-top:6px;overflow:hidden}
.hrow .mini i{display:block;height:100%;background:var(--accent);border-radius:4px}
.hrow.over .mini i{background:var(--warn)}
.hrow .trend{display:flex;align-items:flex-end;gap:5px;height:70px;margin-top:12px}
.hrow .trend div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.hrow .trend i{display:block;width:100%;max-width:28px;background:var(--accent-soft);border-radius:5px 5px 2px 2px;min-height:2px}
.hrow .trend i.cur{background:var(--accent)}
.hrow .trend small{font-size:.65rem;color:var(--muted)}
.settext{font-size:.92rem;color:var(--muted);margin:0 0 10px}
.small-primary{height:48px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-weight:700}
.small-ghost{height:48px;border:1.5px solid var(--line);border-radius:14px;background:none;color:var(--accent);font-weight:700}
.gate{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));overflow:auto}
.gate[hidden]{display:none}
.gate form{width:100%;max-width:380px;display:flex;flex-direction:column;gap:12px}
.gate h1{margin:6px 0 0;text-align:center;font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
.gate p{margin:0;text-align:center;color:var(--muted);font-size:.95rem}
.gate .err{color:var(--warn);text-align:center;font-weight:600;font-size:.9rem;min-height:1.2em}
.gate .lnk{border:0;background:none;color:var(--accent);font-weight:600;padding:6px}
.gate .gmark{width:64px;height:64px;border-radius:15px;display:block;margin:0 auto}
.deskonly{display:none}
@media (min-width:1024px){
  #v-home .pagepad{max-width:1180px}
  #homeBody{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(320px,1fr);gap:32px;align-items:start;padding-top:24px}
  #homeBody .hright>h2:first-child,#homeBody .hright>.nudge:first-child{margin-top:0}
  #homeBody .hero{padding:22px 24px}
  #homeBody .hero .big{font-size:3.4rem}
  #homeBody .rings.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px;overflow:visible;margin:0;padding:0}
  #homeBody .rings.strip .ringcard{flex:none}
  #homeBody .ring,#homeBody .ring svg{width:78px;height:78px}
  #homeBody .ring .ctr b{font-size:1rem}
  #homeBody .ringcard .nm{font-size:.86rem}
  #homeBody .ringcard .of{font-size:.78rem}
  #homeBody .ringcard .pace{font-size:.74rem}
  .deskonly{display:block}
}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* bank sync (SimpleFIN) */
.navbtn .nbadge{margin-left:auto;min-width:22px;height:22px;border-radius:11px;background:var(--accent);color:#fff;font-size:.75rem;font-weight:800;display:grid;place-items:center;padding:0 6px}
.nbadge[hidden]{display:none}
/* depth for the content boxes under the colored header cards */
:root{--lift:0 1px 2px rgba(16,24,40,.05),0 10px 24px -14px rgba(16,24,40,.22)}
:root[data-theme="dark"]{--lift:0 1px 2px rgba(0,0,0,.4),0 10px 24px -14px rgba(0,0,0,.7)}
.card{background:var(--bg);border:1px solid var(--line);box-shadow:var(--lift)}
.list{border-width:1px;box-shadow:var(--lift)}
.pgacc{background:var(--bg);border:1px solid var(--line);box-shadow:var(--lift)}
.rv{box-shadow:var(--lift);border-width:1px}
.ringcard{box-shadow:var(--lift);border-width:1px}
.ringcard.over{box-shadow:0 10px 24px -14px rgba(217,45,32,.45)}
.estline,.hzline{box-shadow:var(--lift)}
.hbars .hbar i{box-shadow:inset 0 -6px 10px -6px rgba(16,24,40,.12)}
.pgact{white-space:normal !important}
.asub{display:flex;justify-content:space-between;color:var(--muted);font-size:.78rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:14px 4px 6px}
.asub:first-of-type{margin-top:4px}
.hzline{display:flex;align-items:center;gap:10px;width:100%;margin-top:10px;border:1.5px solid color-mix(in srgb,var(--good) 35%,transparent);background:color-mix(in srgb,var(--good) 9%,var(--bg));color:var(--good);border-radius:16px;padding:12px 14px;font-weight:600;text-align:left}
.hzline span{flex:1}
.pghero{background-color:var(--good)}
.pghero.neg{background-color:var(--warn)}
.pghero .fine b{color:#fff}
.hero .ibtn{border-color:rgba(255,255,255,.55);color:#fff;background:transparent;width:20px;height:20px;vertical-align:-4px}
.ibtn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);background:var(--bg);color:var(--muted);font:italic 700 .78rem/1 Georgia,"Times New Roman",serif;padding:0;margin-left:7px;flex:none;cursor:pointer;vertical-align:1px}
.ibtn:hover{border-color:var(--muted);color:var(--ink)}
.h2t{display:inline-flex;align-items:center}
.flrow{display:flex;align-items:center}
.flrow .ibtn{margin:14px 0 6px 6px}
#infoPop{position:fixed;z-index:80;background:var(--ink);color:var(--bg);padding:10px 13px;border-radius:12px;font-size:.86rem;line-height:1.38;font-weight:500;box-shadow:0 10px 30px rgba(16,24,40,.25)}
#infoPop[hidden]{display:none}
.syncline{display:flex;align-items:center;gap:14px;margin-top:14px;padding:0 4px;color:var(--muted);font-size:.84rem}
.syncline span{flex:1}
.syncline .linkbtn{padding:0;font-size:.84rem}
.seg.many{display:grid;grid-template-columns:repeat(3,1fr)}
.seg.many button{padding:9px 4px;font-size:.9rem;white-space:nowrap}
.itile{width:42px;height:42px;border-radius:14px;background:var(--surface);color:var(--muted);display:grid;place-items:center;flex:none;font-weight:800;font-size:.86rem;letter-spacing:.02em}
.dtile{width:42px;height:42px;border-radius:12px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface);line-height:1}
.dtile small{font-size:.6rem;font-weight:800;text-transform:uppercase;color:var(--muted);letter-spacing:.06em}
.dtile b{font-size:1.1rem;font-weight:800;margin-top:2px}
.dtile.late small,.dtile.late b{color:var(--warn)}
#homeBody .upnext .dtile,#homeBody .upnext .itile{width:36px;height:36px;border-radius:11px}
#homeBody .deskonly .itile{width:38px;height:38px}
.estline{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:14px;padding:10px 14px;margin-top:18px;font-size:.88rem;color:var(--muted)}
.estline span{flex:1}.estline b{color:var(--ink)}
.estline .linkbtn{padding:4px 2px;font-size:.88rem}
#homeBody .hright>.estline:first-child{margin-top:0}
#accountsBody .row .m,#settingsBody .row .m{white-space:normal}
.rv.one{padding:20px 16px 14px;text-align:center}
.rvamt{font-size:2.5rem;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.rvamt.in{color:var(--good)}
.rvname{font-weight:700;font-size:1.15rem;margin-top:6px;overflow-wrap:anywhere}
.rvmeta{color:var(--muted);font-size:.88rem;margin-top:2px}
.rvraw{color:var(--muted);font-size:.72rem;margin-top:6px;font-family:ui-monospace,Menlo,monospace;overflow-wrap:anywhere;opacity:.8}
.rv.one .match{margin-top:8px}
.rv.one .flabel{text-align:left;margin:16px 2px 8px}
.rvsug{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:16px}
.rvsug .emoji{font-size:1.35rem}
.rvacts{display:flex;flex-wrap:wrap;gap:8px}
.rvacts button{display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 13px;font-weight:600;font-size:.88rem}
.rvacts .emoji{font-size:1.05rem}
.rvacts button.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.rvpay{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;padding:10px;background:var(--surface);border-radius:16px}
.rvpay button{display:flex;align-items:center;gap:10px;border:0;background:var(--bg);border-radius:12px;padding:8px 10px;font-weight:600;font-size:.9rem;text-align:left;min-width:0}
.rvpay button span:last-child{overflow-wrap:anywhere;line-height:1.2}
.rvpay .itile{width:32px;height:32px;border-radius:10px;font-size:.72rem}
.rvpay .dtile{flex:none}
.rvpay .rvsub{display:block;color:var(--muted);font-weight:500;font-size:.76rem}
.rvcats{grid-template-columns:repeat(3,1fr)}
@media (min-width:480px){.rvcats{grid-template-columns:repeat(4,1fr)}}
.rvnav{margin-top:16px}
.rvnav button:disabled{opacity:.35}
.rv{border:1.5px solid var(--line);border-radius:20px;padding:12px 14px 10px;margin-top:10px;background:var(--bg)}
.rv .top{display:flex;align-items:center;gap:12px}
.rv .v.in{color:var(--good)}
.rv .chips{padding:10px 14px 2px;margin:0 -14px}
.rv .chip.sug .bub{background:var(--accent-soft);box-shadow:inset 0 0 0 2.5px var(--accent)}
.rv .chip.sug .nm{color:var(--accent)}
.rv .chip.act .bub{background:var(--surface2)}
.rv .match{font-size:.82rem;color:var(--good);font-weight:600;margin-top:6px}
.rv.busy{opacity:.45;pointer-events:none}
.steps{margin:0;padding-left:1.2em;color:var(--ink)}
.steps li{margin:6px 0}
.steps a{color:var(--accent);font-weight:600}
.lnkrow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line)}
.lnkrow:first-child{border-top:0}
.lnkrow .m,#bankBody .row .m{white-space:normal}
.lnkrow select{flex:0 0 46%;min-width:0;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 10px;font-size:.9rem}
textarea.finput{min-height:92px;resize:vertical;font-family:ui-monospace,Menlo,monospace;font-size:.8rem;word-break:break-all}

/* no double-tap zoom (pinch-to-zoom still works); no auto-zoom when tapping into a field on iPhone */
html{touch-action:manipulation}
@media (pointer:coarse){input,select,textarea{font-size:max(16px,1em)}}
</style>
</head>
<body>
<div class="app" id="app">
  <nav class="nav" id="nav" aria-label="Sections">
    <div class="brand"><img class="bmark" src="icon-v3-192.png" alt="" aria-hidden="true">Budget Tracker</div>
    <div id="navlist"></div>
    <div class="navfoot" id="modeNote"></div>
  </nav>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="appbar">
      <button class="menubtn" id="menuBtn" aria-label="Open menu" aria-controls="nav" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <h1 id="title">Home</h1>
      <button class="topadd" id="topAdd" aria-label="Add transaction" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="leftpill" id="leftPill" aria-label="Allowance left. Go home"><small>Allowance</small><b id="leftAmt">—</b></button>
    </header>

    <section class="view" id="v-home"><div class="pagepad" id="homeBody"></div></section>
    <section class="view" id="v-activity"><div class="pagepad" id="activityBody"></div></section>
    <section class="view" id="v-accounts"><div class="pagepad" id="accountsBody"></div></section>
    <section class="view" id="v-horizon"><div class="pagepad" id="horizonBody"></div></section>
    <section class="view" id="v-bills"><div class="pagepad" id="billsBody"></div></section>
    <section class="view" id="v-planner"><div class="pagepad" id="plannerBody"></div></section>
    <section class="view" id="v-play"><div class="pagepad" id="playBody"></div></section>
    <section class="view" id="v-history"><div class="pagepad" id="historyBody"></div></section>
    <section class="view" id="v-bank"><div class="pagepad" id="bankBody"></div></section>
    <section class="view" id="v-settings"><div class="pagepad" id="settingsBody"></div></section>
    <input type="file" id="restoreFile" accept="application/json,.json" hidden>
  </div>
</div>



<dialog id="addSheet" aria-labelledby="addTitle">
  <div class="sheet">
    <div class="addhead"><h3 id="addTitle" style="margin:0;font-size:1.15rem">Add transaction</h3><button type="button" class="x" id="addClose" aria-label="Close">✕</button></div>
    <div class="display" aria-live="polite"><div class="num zero" id="amtShow" data-watch>$0.00</div></div>
    <div class="selcat" id="selCat"></div>
    <div class="chips" id="chips" role="radiogroup" aria-label="Category"></div>
    <div class="seg" id="kindSeg" role="radiogroup" aria-label="Who pays" style="margin-bottom:8px"><button type="button" role="radio" data-kind="personal" aria-checked="true">Personal</button><button type="button" role="radio" data-kind="work" aria-checked="false">Work (reimbursed)</button></div>
    <div class="padrow"><input id="noteIn" placeholder="Note (optional)" maxlength="60" autocomplete="off"></div>
    <div class="padrow">
      <select id="acctSel" aria-label="Paid with" hidden></select>
      <input type="date" id="dateIn" aria-label="Date">
    </div>
    <div class="keys" id="keys"></div>
    <button class="primary" id="addBtn" disabled>Add transaction</button>
    <button class="danger" type="button" id="txDel" hidden>Delete transaction</button>
  </div>
</dialog>

<dialog id="sheet" aria-labelledby="sheetTitle"><form class="sheet" id="sheetForm" method="dialog"></form></dialog>
<div class="toast" id="toast" role="status"></div>
<div class="gate" id="gate" hidden>
  <form id="gateForm" novalidate>
    <img class="gmark" src="icon-v3-192.png" alt="" aria-hidden="true">
    <h1>Budget Tracker</h1>
    <p id="gMsg">Sign in with the same email and password you use for Ops Hub.</p>
    <input class="finput" id="gEmail" type="email" autocomplete="email" placeholder="Email">
    <input class="finput" id="gPass" type="password" autocomplete="current-password" placeholder="Password (at least 6 characters)">
    <div class="err" id="gErr"></div>
    <button class="primary" type="submit" style="margin-top:0">Sign in</button>
    <button class="small-ghost" type="button" id="gUp">Create account</button>
    <button class="lnk" type="button" id="gForgot">Forgot password?</button>
  </form>
</div>

<script>
/* swipe-to-close for sheets and menus (touch only). Won't close while typing or if you've changed a field. */
window.swipeToClose=function(el,o){
  if(!el)return;const T=o.move||el,dirOf=()=>typeof o.dir==='function'?o.dir():o.dir;
  const fields=()=>[...el.querySelectorAll('input,textarea,select,[data-watch]')].filter(f=>!/^(button|submit|hidden|file)$/.test(f.type));
  const val=f=>f.hasAttribute('data-watch')?f.textContent:f.type==='checkbox'||f.type==='radio'?String(f.checked):f.value;
  let snap=new Map(),snapT=null;const takeSnap=()=>{clearTimeout(snapT);snapT=setTimeout(()=>{snap=new Map(fields().map(f=>[f,val(f)]))},80)};

/* ---------------- per-paycheck allowance ----------------

   Period 1: the 1st up to the mid-month payday, funded by last month's end-of-month check.
   Period 2: mid-month payday to month end, funded by the mid-month check; savings come out here.

async function gatherAll(){
  if (state.mode === "db"){
    const cs = await db.doc("settings/main").get();
    const tx = []; let last = -1;
    for (let guard = 0; guard < 50; guard++){
      const q = await db.collection("tx").where("ts",">",last).orderBy("ts").limit(1000).get();
      q.docs.forEach(d => tx.push(Object.assign({id:d.id}, d.data())));
      if (q.docs.length < 1000) break;
      last = q.docs[q.docs.length-1].data().ts;
    }
    const pq = await db.collection("paid").get(); const paid = {}; pq.docs.forEach(d => { paid[d.id] = d.data(); });
    return {config: cs.exists ? cs.data() : null, tx, paid};
  }
  const o = lsRead(); return {config:o.config||null, tx:o.tx||[], paid:o.paid||{}};
}

/* ---------------- bank sync (SimpleFIN Bridge) ----------------
   The SimpleFIN access URL is a permanent, read-only key to every connected bank account. It lives ONLY in this
   browser's localStorage: never in Firebase, never in a backup file. Imported transactions go to Firebase
   (users/{uid}/apps/budget/bank) so every signed-in device can review them.
   Spec: https://www.simplefin.org/protocol.html. Bridge asks for 24 requests a day or fewer and returns at most 90 days per request. */
const SF_KEY = "budget-simplefin", SF_LOG = "budget-simplefin-log", SF_DAILY = 20, SF_EVERY = 4*3600000, DAY_MS = 86400000;
const SF_SIGNUP = "https://bridge.simplefin.org/", SF_CREATE = "https://bridge.simplefin.org/simplefin/create";
const sfKey = () => { try{ const o = JSON.parse(localStorage.getItem(SF_KEY)); return o && o.url ? o : null; }catch(e){ return null; } };
const sfSave = o => { try{ if (o) localStorage.setItem(SF_KEY, JSON.stringify(o)); else localStorage.removeItem(SF_KEY); }catch(e){} };
const sfLog = () => { try{ return (JSON.parse(localStorage.getItem(SF_LOG))||[]).filter(t => t > Date.now() - DAY_MS); }catch(e){ return []; } };
const sfLogAdd = () => { const l = sfLog(); l.push(Date.now()); try{ localStorage.setItem(SF_LOG, JSON.stringify(l)); }catch(e){} };
const sfErr = msg => Object.assign(new Error(msg), {sf:true});
const localMidnight = ymd => { const [y,m,d] = String(ymd).split("-").map(Number); return new Date(y, (m||1)-1, d||1).getTime(); };
/* Stable doc id per bank transaction, so syncing the same window twice never creates duplicates. */
function bankId(acctId, txId){
  const s = acctId + "|" + txId; let h1 = 0x811c9dc5, h2 = 0x9747b28c;
  for (let i = 0; i < s.length; i++){ const ch = s.charCodeAt(i); h1 = Math.imul(h1 ^ ch, 16777619); h2 = Math.imul(h2 ^ ch, 0x5bd1e995); h2 ^= h2 >>> 13; }
  return "b" + (h1>>>0).toString(36) + (h2>>>0).toString(36);
}
/* "KROGER #123 SPARTANBURG SC" and "Kroger 456" both become "kroger spartanburg"/"kroger": first two words, no numbers or bank noise. */
/* Bank descriptions carry boilerplate: Wells Fargo prefixes every debit with "PURCHASE AUTHORIZED ON 11/03" and appends "S3863... CARD 1234";
   processors add "TST*", "SQ *", "SP+". Strip it so names read cleanly and stores are learned by their real name. */
function cleanDesc(d){
  const x = String(d||"")
    .replace(/^(recurring\s+)?(purchase|payment)\s+(return\s+)?authorized\s+on\s+\d{1,2}\/\d{1,2}\s*/i,"")
    .replace(/^(pos|debit card|checkcard|check card)(\s+purchase)?(\s+\d{4})?\s*-?\s*/i,"")
    .replace(/\s+S\d{9,}\s+CARD\s+\d{4}\s*$/i,"").replace(/\s+CARD\s+\d{4}\s*$/i,"")
    .replace(/^(TST\*|SQ\s?\*|SP\+|SP\s?\*|PY\s?\*|DD\s?\*|IC\*)\s*/i,"")
    .replace(/\s{2,}/g," ").trim();
  return x || String(d||"").trim();
}
/* "PURCHASE AUTHORIZED ON 11/03 ..." posts a day or two later; use the purchase date when the bank gives one. */
function bankTs(b){
  const m = /authorized\s+on\s+(\d{1,2})\/(\d{1,2})/i.exec(b.desc||""); if (!m) return b.ts;
  const p = new Date(b.ts); let d = new Date(p.getFullYear(), +m[1]-1, +m[2], 12);
  if (d - p > 2*DAY_MS) d = new Date(p.getFullYear()-1, +m[1]-1, +m[2], 12);
  return p - d <= 10*DAY_MS && p - d >= -2*DAY_MS ? d.getTime() : b.ts;
}
const merchKey = d => cleanDesc(d).toLowerCase().replace(/[^a-z& ]+/g," ").replace(/\b(pos|purchase|debit|credit|card|recurring|payment|checkcard|ach|sq|tst|pp|www|com|the)\b/g," ").trim().split(/\s+/).filter(Boolean).slice(0,2).join(" ");
const niceDesc = d => cleanDesc(d).slice(0,60);

async function sfClaim(token){
  let claim = "";
  try{ claim = atob(String(token).replace(/\s+/g,"")); }catch(e){}
  if (!/^https:\/\/\S+$/.test(claim)) throw sfErr("That isn't a SimpleFIN setup token. Copy the whole token from the Bridge and paste it here.");
  let r;
  try{ r = await fetch(claim, {method:"POST"}); }catch(e){ throw sfErr("Couldn't reach SimpleFIN. Check your connection and try again."); }
  if (r.status === 403) throw sfErr("SimpleFIN says that token was already used or doesn't exist. If you didn't use it yourself, turn it off on the SimpleFIN Bridge, then make a new one.");
  if (!r.ok) throw sfErr("SimpleFIN returned an error (" + r.status + "). Try again in a minute.");
  const url = (await r.text()).trim();
  let u = null; try{ u = new URL(url); }catch(e){}
  if (!u || u.protocol !== "https:" || !u.username || !u.password) throw sfErr("SimpleFIN sent back something unexpected. Make a new token and try again.");
  return url;
}
async function sfAccounts(params){
  const k = sfKey(); if (!k) throw sfErr("This device isn't connected to SimpleFIN.");
  const u = new URL(k.url);
  // fetch() refuses URLs with user:pass in them, so the credentials go in an Authorization header instead.
  const auth = "Basic " + btoa(decodeURIComponent(u.username) + ":" + decodeURIComponent(u.password));
  const base = u.origin + u.pathname.replace(/\/$/,"");
  const qs = new URLSearchParams(Object.assign({version:"2"}, params||{}));
  sfLogAdd();
  let r;
  try{ r = await fetch(base + "/accounts?" + qs, {headers:{Authorization:auth}, cache:"no-store"}); }
  catch(e){ throw sfErr("Couldn't reach SimpleFIN. Check your connection and try again."); }
  if (r.status === 402) throw sfErr("SimpleFIN says your Bridge subscription needs payment.");
  if (r.status === 403) throw sfErr("SimpleFIN turned down this device's key. It may have been turned off on the Bridge. Disconnect below, then connect again with a new token.");
  if (!r.ok) throw sfErr("SimpleFIN returned an error (" + r.status + "). Try again later.");
  const d = await r.json();
  const conns = Object.fromEntries((d.connections||[]).map(x => [x.conn_id, x]));
  const accounts = (d.accounts||[]).map(a => {
    const cn = conns[a.conn_id] || {}, og = a.org || {};
    return {id:String(a.id), name:String(a.name||"Account"), org:String(cn.name || cn.org_name || og.name || og.domain || ""),
      bal:Math.round(parseFloat(a.balance)*100) || 0, at:(+a["balance-date"]||0)*1000, tx:Array.isArray(a.transactions) ? a.transactions : []};
  });
  const errors = (Array.isArray(d.errlist) && d.errlist.length ? d.errlist.map(e => e.msg || e.code) : (d.errors||[])).map(String);
  return {accounts, errors};
}
const bankName = (id, n) => ({name:n.name, org:n.org, bal:n.bal, at:n.at});

async function bankConnect(token){
  if (state.bankBusy || state.readOnly) return;
  state.bankBusy = true; renderBankUI();
  try{
    const url = await sfClaim(token);
    sfSave({url, at:Date.now()});
    const {accounts, errors} = await sfAccounts({"balances-only":"1"});
    editCfg(c => { accounts.forEach(a => { c.bank.names[a.id] = bankName(a.id, a); }); if (!c.bank.from) c.bank.from = todayStr(); });
    state.bankErr = errors; state.bankLinking = true;
    toast(accounts.length ? `Connected. Found ${accounts.length} account${accounts.length===1?"":"s"}. Match each one below.` : "Connected, but no accounts yet. Add banks on the SimpleFIN Bridge, then tap Refresh account list.");
  }catch(e){
    state.bankErr = [e.sf ? e.message : "Couldn't connect: " + (e.message || e)];
    toast(state.bankErr[0]);
  }finally{ state.bankBusy = false; renderAll(); }
}
async function bankSync(manual){
  if (state.bankBusy || state.readOnly || state.mode === "loading") return;
  if (!sfKey()){ if (manual) toast("Connect this device first."); return; }
  const bk = cfg().bank;
  if (!Object.values(bk.links).some(Boolean)){ if (manual) toast("Match at least one bank account first."); return; }
  if (sfLog().length >= SF_DAILY){ if (manual) toast(`Already synced ${SF_DAILY} times today. SimpleFIN allows about 24 a day; try again later.`); return; }
  state.bankBusy = true; renderAll();
  try{
    const fromTs = bk.from ? localMidnight(bk.from) : localMidnight(todayStr());
    // Re-ask for the last week every time: banks post late, and the stable ids drop anything already imported.
    let start = bk.lastSync ? Math.max(fromTs, bk.lastSync - 7*DAY_MS) : fromTs;
    start = Math.max(start, Date.now() - 89*DAY_MS);
    const {accounts, errors} = await sfAccounts({"start-date": String(Math.floor(start/1000))});
    const have = await store.bankIds(start - 14*DAY_MS);
    const links = cfg().bank.links, fresh = [];
    accounts.forEach(a => {
      const to = links[a.id]; if (!to) return;
      a.tx.forEach(t => {
        if (t.pending || !+t.posted) return;  // pending items get a new id once they post, so wait for the posted version
        const ts = (+t.transacted_at || +t.posted) * 1000;
        if (ts < fromTs) return;
        const amt = -Math.round(parseFloat(t.amount)*100);  // SimpleFIN: negative = money out. App: positive = money out.
        if (!amt) return;
        const id = bankId(a.id, t.id); if (have.has(id)) return; have.add(id);
        const desc = String(t.description || t.payee || "Bank transaction").slice(0,120), ts2 = bankTs({desc, ts});
        fresh.push({id, status:"new", bacct:a.id, acct:to, ts:ts2, amt, desc, month:monthKey(new Date(ts2)), added:Date.now()});
      });
    });
    await store.bankAdd(fresh);
    editCfg(c => {
      accounts.forEach(a => {
        c.bank.names[a.id] = bankName(a.id, a);
        const ac = c.accounts.find(x => x.id === c.bank.links[a.id]);
        // Cards and loans: the app tracks what you owe as a positive number; banks report it either sign.
        if (ac && ac.type !== "reimb"){ ac.balance = DEBT.has(ac.type) ? Math.abs(a.bal) : a.bal; ac.updated = a.at || Date.now(); }
      });
      c.bank.lastSync = Date.now();
    });
    state.bankErr = errors;
    if (manual || fresh.length) toast(fresh.length ? `${fresh.length} new bank transaction${fresh.length===1?"":"s"} to review. Balances updated.` : "Up to date. Balances updated.");
  }catch(e){
    state.bankErr = [e.sf ? e.message : "Sync failed: " + (e.message || e)];
    if (manual) toast(state.bankErr[0]);
  }finally{ state.bankBusy = false; renderAll(); }
}
/* Runs on open and when the app comes back to the foreground, at most every 4 hours, only on the connected device. */
function bankAuto(){
  if (!sfKey() || state.mode === "loading" || !state.cfgSeen) return;
  const l = sfLog(); if (l.length && Date.now() - l[l.length-1] < SF_EVERY) return;
  bankSync(false);
}

/* Learning: tally every choice per store and suggest the one picked most often. Ties go to the most recent pick.
   prev (when re-filing from Activity) takes one vote back from the old choice. */
const GENERIC_WORDS = new Set(["credit","card","cards","loan","gold","bank","account","payment","visa","platinum","rewards","checking","savings"]);
function learn(y, key, v, prev){
  if (!key) return;
  const t = Object.assign({}, y.bank.tally[key]);
  if (!Object.keys(t).length && y.bank.rules[key]) t[y.bank.rules[key]] = 1;   // stores learned before tallies existed
  if (prev && t[prev]) { t[prev]--; if (!t[prev]) delete t[prev]; }
  t[v] = (t[v] || 0) + 1;
  let best = v; Object.entries(t).forEach(([k, n]) => { if (n > t[best]) best = k; });
  y.bank.tally[key] = t; y.bank.rules[key] = best;
}
/* A hand-entered purchase that looks like this bank item: same amount, same card (or none), within 4 days. */
function bankMatch(b, used){
  if (b.amt <= 0) return null;
  // include past months (loaded with History) so catching up on Sep/Oct finds what you logged by hand back then
  const pool = state.cur.tx.concat(state.viewTx || [], ...Object.values((state.hist && state.hist.months) || {}));
  return pool.find(t => !t.bank && !used.has(t.id) && t.amt === b.amt && (!t.acct || t.acct === b.acct) && Math.abs(t.ts - bankTs(b)) <= 4*DAY_MS) || null;
}
/* Banks abbreviate: "DOVENMUEHLE MTG MORTG PYMT" is a mortgage, "DUKE-ENERGY" is Duke Energy. */
const BILL_ALIAS = {mortgage:["mtg","mortg","mort","mortgage","home loan"], insurance:["ins","insur"], electric:["elec"], energy:["enrgy"], water:["wtr"], phone:["wireless","verizon","att","t-mobile","tmobile"], internet:["spectrum","xfinity","comcast","att","fiber"], car:["auto"], payment:[],
  claude:["anthropic","claude"], anthropic:["claude"], chatgpt:["openai"], openai:["chatgpt"]};
function billNameHit(name, d){
  const toks = d.split(/[^a-z0-9]+/).filter(Boolean);
  return String(name).toLowerCase().split(/[^a-z0-9]+/).filter(w => w.length >= 3).some(w =>
    d.includes(w) || toks.some(t => t.length >= 4 && w.startsWith(t)) || (BILL_ALIAS[w] || []).some(al => al.includes(" ") ? d.includes(al) : toks.includes(al)));
}
/* An unpaid bill this month that this bank payment looks like: bill name in the description and/or the exact amount. */
/* Which bill a bank payment is, if any. The bill's month comes from the purchase date (an Oct 29 charge is October's bill).
   Name alone isn't enough ("AMAZON MKTPL" is both the subscription and every Amazon order): the amount has to be close too.
   strong = name + amount agree (beats a learned store pick); weak = exact amount only, no name (used only when nothing is learned). */
const billMonth = b => monthKey(new Date(bankTs(b)));
function bankBill(c, b, usedBills){
  const mo = billMonth(b);
  if (b.amt <= 0 || (mo !== NOW && mo !== shiftKey(NOW, -1))) return null;
  const d = String(b.desc||"").toLowerCase(), paid = mo === NOW ? state.cur.paid : {};
  let best = null, score = 0;
  insts(c, mo).forEach(x => {
    if (usedBills && usedBills.has(x.pid)) return;
    const ref = mo === NOW ? billAmt(x) : x.amount, diff = Math.abs(b.amt - ref);
    const close = ref > 0 && diff <= (x.varies ? Math.max(1500, ref * 0.5) : Math.max(100, ref * 0.1));
    const nameHit = billNameHit(x.name, d), exact = b.amt >= 2000 && b.amt === ref;
    let sc = 0;
    if (nameHit && close) sc = 3 + (diff === 0 ? 1 : 0);
    else if (exact) sc = 1;
    // Every-2-weeks bills have two due dates a month: the one nearest the payment date wins (up to +0.4).
    if (sc){ const [yy, mm] = mo.split("-").map(Number), due = new Date(yy, mm - 1, Math.min(x.day, daysIn(mo)), 12).getTime(); sc += 0.4 * (1 - Math.min(Math.abs(due - bankTs(b)) / DAY_MS, 14) / 14); }
    if (sc && paid[x.pid]) sc -= 0.5;   // already checked off: still a match, ranked lower
    if (sc > score){ score = sc; best = Object.assign({}, x, {strong: sc >= 2}); }
  });

/* ---------------- header cards tilt toward your finger while held ---------------- */
(function(){
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  let card = null, rect = null;
  const set = e => {
    const x = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width)), y = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
    card.style.setProperty("--ry", ((x - .5) * 14).toFixed(2) + "deg");
    card.style.setProperty("--rx", ((.5 - y) * 12).toFixed(2) + "deg");
    card.style.setProperty("--gx", (x * 100).toFixed(1) + "%"); card.style.setProperty("--gy", (y * 100).toFixed(1) + "%");
  };
  const end = () => { if (!card) return; const c = card; card = null;
    c.classList.remove("tilt"); ["--rx","--ry","--sc","--gx","--gy"].forEach(k => c.style.removeProperty(k)); };
  document.addEventListener("pointerdown", e => {
    const c = e.target.closest(".hero"); if (!c || e.target.closest("button,a,input,select")) return;
    card = c; rect = c.getBoundingClientRect(); c.classList.add("tilt"); c.style.setProperty("--sc", ".985"); set(e);
    if (navigator.vibrate) try{ navigator.vibrate(6); }catch(_){}
  }, {passive:true});
  document.addEventListener("pointermove", e => { if (card) set(e); }, {passive:true});
  ["pointerup","pointercancel","blur"].forEach(t => (t === "blur" ? window : document).addEventListener(t, end));
  document.addEventListener("scroll", end, {passive:true, capture:true});
})();

function toast(msg){ const el = $("toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(tt); tt = setTimeout(()=>el.classList.remove("show"), 2800); }
function renderAll(){
  renderHeader();
  if (state.view === "home") renderHome();
  if ($("addSheet").open) renderChips();
  $("topAdd").hidden = true;   // everything comes from the bank; cash expenses: Activity link or tap a budget ring
  if (state.view === "activity") renderActivity();
  if (state.view === "accounts") renderAccounts();
  if (state.view === "horizon") renderHorizon();
  if (state.view === "bills") renderBills();
  if (state.view === "planner") renderPlanner();
  if (state.view === "play") renderPlay();
  if (state.view === "history") renderHistory();
  if (state.view === "settings") renderSettings();
  if (state.view === "bank") renderBank();
  const bb = $("bankBadge"); if (bb){ bb.hidden = !state.bankNew.length; bb.textContent = state.bankNew.length; }
  clearTimeout(snapT); snapT = setTimeout(syncSnap, 1500);
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState !== "visible") return; if (monthKey(new Date()) !== NOW) return location.reload(); bankAuto(); });

/* ---------------- boot ---------------- */
go((location.hash || "#home").slice(1));
window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (v !== state.view) go(v); });
(async function boot(){
  try{ const fb = await window.FB.ready; if (fb && fb.db){ db = fb.db; state.mode = "db"; } }catch(e){ db = null; }
  if (!db) state.mode = "local";
  subscribeAll();
})();
})();

<script src="config.js"></script>
<script type="module">
const V='10.12.2';
const gate=document.getElementById('gate'),err=document.getElementById('gErr'),msg=document.getElementById('gMsg');
const MSG={'auth/invalid-credential':'That email and password don’t match. Try again, or tap Forgot password.','auth/user-not-found':'No account with that email yet. Tap Create account.','auth/email-already-in-use':'That email already has an account. Tap Sign in instead.','auth/weak-password':'Use at least 6 characters for the password.','auth/invalid-email':'That email address doesn’t look right.','auth/missing-password':'Type your password.','auth/network-request-failed':'No internet connection. Try again when you have signal.','auth/too-many-requests':'Too many tries. Wait a minute and try again.'};
const say=e=>{err.textContent=MSG[e&&e.code]||('Something went wrong'+(e&&e.code?' ('+e.code+')':'')+'.')};
if(window.__MOCK_DB){window.FB.email='test@example.com';window.FB._r({db:window.__MOCK_DB})}
else if(!window.OPS_CONFIG||!window.OPS_CONFIG.apiKey){window.FB._r(null)}
else{
  try{
  const [{initializeApp},A,F]=await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`),
    import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`)]);
  const app=initializeApp(window.OPS_CONFIG);
  const auth=A.getAuth(app);
  let fs;try{fs=F.initializeFirestore(app,{ignoreUndefinedProperties:true,localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}catch(e){fs=F.getFirestore(app)}
  const ws=s=>({id:s.id,exists:s.exists(),data:()=>s.data(),metadata:s.metadata});
  const wq=s=>({docs:s.docs.map(ws),size:s.size,empty:s.empty,metadata:s.metadata});
  function makeDb(uid){
    const pre='users/'+uid+'/apps/budget/';
    const D=p=>{const r=F.doc(fs,pre+p);return{path:p,id:r.id,get:async()=>ws(await F.getDoc(r)),set:d=>F.setDoc(r,d),update:d=>F.updateDoc(r,d),delete:()=>F.deleteDoc(r),collection:c=>C(p+'/'+c),onSnapshot:(n,e)=>F.onSnapshot(r,s=>n(ws(s)),e)}};
    const Q=(ref,cons)=>{const q=()=>cons.length?F.query(ref,...cons):ref;return{
      where:(f,op,v)=>Q(ref,cons.concat([F.where(f,op,v)])),orderBy:(f,d)=>Q(ref,cons.concat([F.orderBy(f,d||'asc')])),limit:n=>Q(ref,cons.concat([F.limit(n)])),
      get:async()=>wq(await F.getDocs(q())),onSnapshot:(n,e)=>F.onSnapshot(q(),s=>n(wq(s)),e)}};
    const C=p=>{const r=F.collection(fs,pre+p);return Object.assign(Q(r,[]),{path:p,doc:id=>D(p+'/'+(id||Math.random().toString(36).slice(2))),add:async d=>{const x=await F.addDoc(r,d);return D(p+'/'+x.id)}})};
    return{doc:D,collection:C};
  }
  window.FB.signOut=async()=>{try{await A.signOut(auth)}catch(e){}try{localStorage.removeItem('budget-v1');localStorage.removeItem('budget-simplefin')}catch(e){}location.reload()};
  let started=false;
  A.onAuthStateChanged(auth,u=>{
    if(u){window.FB.email=u.email;gate.hidden=true;if(!started){started=true;window.FB._r({db:makeDb(u.uid)})}}
    else gate.hidden=false;
  });
  const em=document.getElementById('gEmail'),pw=document.getElementById('gPass');
  const busy=b=>gate.querySelectorAll('button').forEach(x=>x.disabled=b);
  document.getElementById('gateForm').addEventListener('submit',async e=>{e.preventDefault();err.textContent='';busy(true);try{await A.signInWithEmailAndPassword(auth,em.value.trim(),pw.value)}catch(x){say(x)}busy(false)});
  document.getElementById('gUp').onclick=async()=>{err.textContent='';busy(true);try{await A.createUserWithEmailAndPassword(auth,em.value.trim(),pw.value)}catch(x){say(x)}busy(false)};
  document.getElementById('gForgot').onclick=async()=>{err.textContent='';const v=em.value.trim();if(!v){err.textContent='Type your email first, then tap Forgot password.';return}try{await A.sendPasswordResetEmail(auth,v);msg.textContent='Check your email for a link to set a new password, then come back and sign in.'}catch(x){say(x)}};
  }catch(e){console.warn('Firebase unavailable',e);window.FB._r(null)}
}
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
</body>
</html>
